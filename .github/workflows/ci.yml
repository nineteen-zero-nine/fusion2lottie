name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fidelity/package-lock.json
      # lottie-web and puppeteer for the fidelity tests, which play every conversion in Chrome
      - run: npm ci
        working-directory: fidelity
      - run: uv run pytest
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fidelity-${{ matrix.python }}
          path: .fidelity/
