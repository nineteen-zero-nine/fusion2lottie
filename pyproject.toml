[project]
name = "fusion2lottie"
version = "0.1.0"
description = "Convert Fusion compositions from DaVinci Resolve to Lottie animations for the web and apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nineteen-zero-nine" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["lottie", "fusion", "davinci-resolve", "motion-design", "animation", "bodymovin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/nineteen-zero-nine/fusion2lottie"

[project.scripts]
fusion2lottie = "fusion2lottie.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
pythonpath = ["tests"]
